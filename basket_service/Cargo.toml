[package]
name = "design-patterns-project-basket-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "basket_service"
path = "src/main.rs"

[dependencies]
basket_communication = { path = "../basket_communication" }
anyhow = "1.0.97"
futures = "0.3.31"
tokio = { version = "1.44.2", features = ["full"] }
lapin = "2.5.1"
prost = "0.13.5"
thiserror = "2.0.12"
tonic = "0.13.0"

[features]
default = ["extra_protection"]
extra_protection = []

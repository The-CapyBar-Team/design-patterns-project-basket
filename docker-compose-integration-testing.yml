services:
  redis:
    image: redis:6.2.0-alpine
    ports:
      - "6379:6379"
    networks:
      - basket_network
  basket_service_integration_testing:
    build:
      context: .
      dockerfile: docker/IntegrationTesting_Dockerfile
    environment:
      - REDIS_HOSTNAME=redis
      - TEST_NAME=${TEST_NAME}
    networks:
      - basket_network
    depends_on:
      - redis

networks:
  basket_network:
    driver: bridge


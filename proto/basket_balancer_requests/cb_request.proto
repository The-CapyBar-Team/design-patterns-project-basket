syntax = "proto3";

package cb_request;

enum ConnectionStatus {
  CONNECTION_SUCCESS = 0;
  CONNECTION_POOL_IS_FULL = 1;
  ALREADY_CONNECTED = 2;
  INTERNAL_ERROR = 3;
}

message Request {
  string hostname = 1;
  uint32 port = 2;
}

message Response {
  string error_message = 1;
  ConnectionStatus status = 2;
}

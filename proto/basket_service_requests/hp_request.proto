syntax = "proto3";

package hp_request;

enum FailureStatus {
    HOLDERS_QUEUE_ALREADY_FULL = 0;
    PRODUCT_NOT_FOUND = 1;
    USER_ALREADY_ADDED = 2;
}

message Request {
  string user_id = 1;
  int32 product_id = 2;
}

message Response {
  oneof response {
    Success success = 1;
    Failure failure = 2;
  }
}

message Success {
  string user_id = 1;
  int32 product_id = 2;
	uint64 acquisitionTime = 3;
}

message Failure {
  string error_message = 1;
  FailureStatus status = 2;
}

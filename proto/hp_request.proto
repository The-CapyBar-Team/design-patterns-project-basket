syntax = "proto3";

package hp_request;

enum ProductStatus {
    PRODUCT_HELD_BY_USER = 0;
    HOLDERS_QUEUE_ALREADY_FULL = 1;
    PRODUCT_NOT_FOUND = 2;
    PREMATURE_AWAIT = 3;
    USER_ALREADY_ADDED = 4;
    QUEUE_POSITION_IS_INCORRECT = 5;
}

message Request {
  uint32 user_id = 1;
  uint32 product_id = 2;
  uint32 queue_position = 3;
}

message Response {
  uint32 user_id = 1;
  uint32 product_id = 2;
  uint32 queue_position = 3;
  ProductStatus status = 4;
}
